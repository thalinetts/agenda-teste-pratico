<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda semanal · Agenda+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica o tema salvo antes da renderização (evita "piscar" ao abrir)
    try { document.documentElement.dataset.theme = localStorage.getItem("agenda-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
  </script>
  <script src="app.js" defer></script>
</head>
<body>
<div class="app">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo">A</span>
      <div><strong>Agenda+</strong><small>Clínica Sorriso</small></div>
    </div>
    <nav class="nav" aria-label="Principal">
      <a class="nav-item is-active" aria-current="page"><i data-icon="calendar"></i>Agenda semanal</a>
      <a class="nav-item" aria-disabled="true" title="Em breve"><i data-icon="users"></i>Pacientes</a>
      <a class="nav-item" aria-disabled="true" title="Em breve"><i data-icon="sparkles"></i>Serviços</a>
      <a class="nav-item" aria-disabled="true" title="Em breve"><i data-icon="chart"></i>Relatórios</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Alternar modo noturno">
      <span class="knob"><i data-icon="sun" id="theme-icon"></i></span><span id="theme-label">Modo claro</span>
    </button>
    <div class="side-box side-alert" id="side-alert"></div>
    <div class="side-box legend">
      <p>Legenda</p>
      <span><i class="dot dot-ok"></i>Confirmado</span>
      <span><i class="dot dot-pend"></i>Pendente</span>
      <span><i class="dot dot-canc"></i>Cancelado</span>
      <span><i class="dot dot-conf"></i>Conflito</span>
    </div>
  </aside>

  <!-- ===== Conteúdo ===== -->
  <main class="main">
    <header class="top">
      <div>
        <p class="greeting" id="greeting"></p>
        <h1 id="range-label"></h1>
      </div>
      <div class="top-actions">
        <div class="nav-group">
          <button class="btn btn-ghost" id="btn-today">Hoje</button>
          <button class="btn btn-ghost btn-icon" id="btn-prev" aria-label="Semana anterior"><i data-icon="left"></i></button>
          <button class="btn btn-ghost btn-icon" id="btn-next" aria-label="Próxima semana"><i data-icon="right"></i></button>
        </div>
        <select id="agenda-select" class="control" aria-label="Agenda"></select>
        <button class="btn btn-primary" id="btn-new"><i data-icon="plus"></i>Novo Agendamento</button>
      </div>
    </header>

    <section class="stats" id="stats" aria-label="Resumo da semana"></section>

    <section class="toolbar">
      <label class="search">
        <i data-icon="search"></i>
        <input type="search" id="search" placeholder="Buscar cliente ou serviço…" aria-label="Buscar agendamentos">
      </label>
      <div class="chips" id="chips" role="group" aria-label="Filtrar por status"></div>
    </section>

    <section class="board" aria-label="Grade semanal"><table id="grid"></table></section>
    <p class="empty" id="empty" hidden>Nenhum agendamento encontrado nesta semana.
      <button class="btn btn-ghost" id="btn-clear">Limpar busca e filtros</button></p>
  </main>
</div>

<!-- Modal: criar / editar -->
<dialog id="dlg-form" aria-labelledby="form-title">
  <form id="form" novalidate>
    <div class="dlg-head">
      <h2 id="form-title"></h2>
      <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Fechar"><i data-icon="x"></i></button>
    </div>
    <label class="field">Nome do cliente
      <input class="control" name="name" maxlength="80" placeholder="Ex.: Helena Martins" autocomplete="off">
      <span class="field-error" id="err-name" role="alert"></span>
    </label>
    <div class="row">
      <label class="field">Dia
        <input class="control" type="date" name="date" required>
        <span class="field-error" id="err-date" role="alert"></span>
      </label>
      <label class="field">Horário<select class="control" name="time"></select></label>
    </div>
    <div class="row">
      <label class="field">Serviço<select class="control" name="service"></select></label>
      <label class="field">Status<select class="control" name="status"></select></label>
    </div>
    <label class="field">Agenda<select class="control" name="agenda"></select></label>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger" id="btn-delete"><i data-icon="trash"></i>Excluir</button>
      <button type="button" class="btn btn-secondary" data-close>Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</dialog>

<!-- Modal: confirmação (conflito e exclusão) -->
<dialog id="dlg-confirm" aria-labelledby="confirm-title">
  <form>
    <span class="confirm-icon" id="confirm-icon"></span>
    <h2 id="confirm-title"></h2>
    <div id="confirm-text"></div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-secondary" id="confirm-no"></button>
      <button type="button" class="btn" id="confirm-yes"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
